upstream api_backend {
    server api:9000;
}

upstream frontend_backend {
    server frontend:3000;
}

# ── Subdomain tenants: *.ethr.test ──────────────────────────────────────────
# Tenant resolution works because the Host header is preserved end to end —
# ResolveTenant reads $request->getHost().
#
# An earlier comment here claimed X-Forwarded-Host was what made that work. It
# is not: no proxy is trusted (see api/bootstrap/app.php), so Symfony ignores
# that header entirely, and the API is served over FastCGI, which does not send
# it in the first place. The header below is harmless but load-bearing on
# nothing. Do NOT "fix" tenant resolution by trusting it — the Host header is
# the tenant selector, so a client-supplied override would be tenant spoofing.

server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.ethr\.test$;

    client_max_body_size 20M;

    root /var/www/api/public;
    index index.php;

    # Kept for any future upstream that does read it; tenant resolution does not.
    proxy_set_header X-Forwarded-Host $host;

    # Health check
    location /up {
        try_files $uri /index.php?$query_string;
    }

    # API routes → PHP-FPM
    location ~ ^/(api|sanctum)/ {
        try_files $uri /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass api_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Static assets from API public dir
    location /build {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # MinIO presigned URL proxy
    location /storage {
        proxy_pass http://minio:9000/ethr;
        proxy_set_header Host $host;
    }

    # Frontend for non-API paths on tenant subdomains
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
}

# ── Base domain: localhost / ethr.test ──────────────────────────────────────
server {
    listen 80 default_server;
    server_name localhost ethr.test _;

    client_max_body_size 20M;

    root /var/www/api/public;
    index index.php;

    # Health / API (no tenant required)
    location ~ ^/(api|sanctum|up)/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location /build {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage {
        proxy_pass http://minio:9000/ethr;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
}
