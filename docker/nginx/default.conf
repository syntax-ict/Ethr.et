upstream api_backend {
    server api:9000;
}

upstream frontend_backend {
    server frontend:3000;
}

# ── Subdomain tenants: *.ethr.test ──────────────────────────────────────────
# Tenant resolution works because the Host header is preserved end to end —
# ResolveTenant reads $request->getHost().
#
# An earlier comment here claimed X-Forwarded-Host was what made that work. It
# is not: no proxy is trusted (see api/bootstrap/app.php), so Symfony ignores
# that header entirely, and the API is served over FastCGI, which does not send
# it in the first place. The header below is harmless but load-bearing on
# nothing. Do NOT "fix" tenant resolution by trusting it — the Host header is
# the tenant selector, so a client-supplied override would be tenant spoofing.

server {
    listen 80;
    # Two tenant host shapes, because local development has two:
    # `*.ethr.test` for the default stack, and `*.localhost` for the
    # docker-compose.hostnames.yml overlay (browsers resolve any `*.localhost`
    # to 127.0.0.1 themselves, RFC 6761, so it needs no DNS or hosts file).
    #
    # `[^.]+` rather than `.+`: only a single label in front of the apex is a
    # tenant, which is what ResolveTenant::extractSubdomain() enforces and all
    # the production wildcard certificate covers. With `.+`, `a.b.ethr.test`
    # matched here and then 404'd inside Laravel — the same answer by a more
    # confusing route.
    #
    # Bare `localhost` does not match (no dot), so the apex still falls through
    # to the default_server block below and keeps serving the marketing site.
    server_name ~^(?<subdomain>[^.]+)\.(ethr\.test|localhost)$;

    client_max_body_size 20M;

    root /var/www/api/public;
    index index.php;

    # Kept for any future upstream that does read it; tenant resolution does not.
    proxy_set_header X-Forwarded-Host $host;

    # Health check
    location /up {
        try_files $uri /index.php?$query_string;
    }

    # API routes → PHP-FPM
    location ~ ^/(api|sanctum)/ {
        try_files $uri /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass api_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Static assets from API public dir
    location /build {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # MinIO presigned URL proxy
    location /storage {
        proxy_pass http://minio:9000/ethr;
        proxy_set_header Host $host;
    }

    # The tenant's public landing page — Laravel, not Next.
    #
    # An exact match, so it wins over the prefix `location /` below without
    # touching it: every other path on a tenant host still proxies to the
    # frontend. Mirrors the production rule in infrastructure/nginx.conf; the
    # two must stay in step, because this is the only place the landing page
    # can be seen in a browser before deployment.
    #
    # Reachable at http://demo.localhost:8888/ — port 8888 is nginx. Port 3000
    # is the Next dev server directly and bypasses nginx entirely, so the
    # landing page does not exist there.
    location = / {
        try_files $uri /index.php?$query_string;
    }

    # Tenant logo and hero image, streamed from storage by Laravel.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    # Crawler files and the signed preview, all Laravel's on a tenant host.
    # Mirrors infrastructure/nginx.conf; without these the frontend block below
    # answers instead, because it catches every path not named here.
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
    }

    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /preview/ {
        try_files $uri /index.php?$query_string;
    }

    # Frontend for non-API paths on tenant subdomains
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
}

# ── Base domain: localhost / ethr.test ──────────────────────────────────────
server {
    listen 80 default_server;
    server_name localhost ethr.test _;

    client_max_body_size 20M;

    root /var/www/api/public;
    index index.php;

    # Health / API (no tenant required)
    location ~ ^/(api|sanctum|up)/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location /build {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage {
        proxy_pass http://minio:9000/ethr;
        proxy_set_header Host $host;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
}
