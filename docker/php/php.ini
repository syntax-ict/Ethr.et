memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; DEVELOPMENT config -- production uses docker/php/php.prod.ini (same split as
; www.conf / www.prod.conf).
;
; validate_timestamps = 0 here is a measured trade-off, not an oversight, and it
; was 1 for a while on the reasoning below. Both settings are genuinely bad; this
; is the less bad one.
;
; The case for 1: docker-compose.yml bind-mounts ./api into the container, so the
; source changes underneath it. With 0, opcache never re-reads those files and an
; edit is silently ignored until the container restarts -- code on disk and code
; executing drift apart with no error. That cost a debugging session on
; 2026-08-15 (a stale DirectoryController kept 500ing on a column the file on
; disk no longer referenced) and again on 2026-08-22.
;
; The case against 1, measured on Docker Desktop for Windows 2026-08-22, same
; container, same request (GET /api/v1/ping), only this line changed:
;
;   validate_timestamps = 1   ->  7-18 s   *every* request
;   validate_timestamps = 0   ->  22 s once (cold opcache), then 0.3-0.6 s
;
; With 1, every request re-stats the whole include graph across the bind mount,
; and that filesystem is slow enough to make the stack unusable -- `php artisan
; --version` alone takes 25 s wall against 0.7 s of CPU, i.e. it is nearly all
; I/O wait. revalidate_freq = 2 does not rescue it: any request arriving more
; than 2 s after the last one still pays in full, which is every request during
; manual testing.
;
; So: keep 0, and make the staleness loud instead of silent. After editing PHP,
; run `bash scripts/api-reload.sh` (restarts the container, then nginx, which
; caches the old container IP). The real fix is to stop bind-mounting on Windows
; -- a named volume or a WSL2-native checkout -- which is the same root cause as
; the lossy test collection documented in scripts/pest-isolated.sh.
opcache.validate_timestamps = 0
expose_php = Off
