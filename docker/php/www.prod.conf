[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; Production: ondemand to save memory when idle
pm = ondemand
; max_children must be derived from the container's memory limit, not from the
; host's. docker-compose.prod.yml caps each api replica at 1G (deploy.resources
; .limits.memory) while docker/php/php.ini allows each worker up to 256M, so the
; previous value of 40 permitted the pool to reach several GB — the cgroup would
; OOM-kill the container under exactly the load it was sized for. Budget:
; ~1024M limit, less ~150M for the fpm master and base image, over ~100M for a
; typical Laravel request = 8. Two replicas gives 16 concurrent PHP requests.
; Raising this REQUIRES raising limits.memory in docker-compose.prod.yml by the
; same factor.
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500
pm.status_path = /status

; Logging
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
