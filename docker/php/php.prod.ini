; Production PHP config. Mirrors the docker/php/www.conf -> www.prod.conf split:
; the unsuffixed file is the development one, this is its production counterpart.
;
; The only intentional difference from php.ini is opcache.validate_timestamps.
; Here it is 0 because production code is baked into the image and never changes
; underneath a running container, so re-stat'ing every file on every request is
; pure overhead. In development the source is bind-mounted and does change, which
; is why php.ini must leave revalidation on -- see the comment there.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
expose_php = Off
