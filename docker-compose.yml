services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/api/public:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - ethr
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=ethr
      - DB_USERNAME=ethr
      - DB_PASSWORD=ethr_secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - BROADCAST_CONNECTION=reverb
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=ethr_minio
      - MINIO_SECRET_KEY=ethr_minio_secret
      - MINIO_BUCKET=ethr
      - MINIO_USE_PATH_STYLE=true
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ethr
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=ethr
      - DB_USERNAME=ethr
      - DB_PASSWORD=ethr_secret
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ethr
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=ethr
      - DB_USERNAME=ethr
      - DB_PASSWORD=ethr_secret
      - REDIS_HOST=redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ethr
    restart: unless-stopped

  frontend:
    build:
      context: ./src
      dockerfile: ../docker/frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - PORT=3000
    networks:
      - ethr
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_DATABASE=ethr
      - DB_USERNAME=ethr
      - DB_PASSWORD=ethr_secret
      - REDIS_HOST=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ethr
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
      MARIADB_DATABASE: ethr
      MARIADB_USER: ethr
      MARIADB_PASSWORD: ethr_secret
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ethr
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ethr_minio
      MINIO_ROOT_PASSWORD: ethr_minio_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  minio_data:

networks:
  ethr:
    driver: bridge
