version: 2

# Note for whoever reads the first batch of PRs: as of 2026-09-15 this project
# had 5 advisories in production dependencies — including two CRITICAL
# unauthenticated-RCE advisories against next@16.2.12 — and 22 more in dev-only
# tooling. Expect a busy first week. docs/security-audit.md's note that there
# was "no clean in-range fix" was true when written and is not any more.

updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Laravel's own packages move together; separate PRs for each produce
      # conflicts rather than information.
      laravel:
        patterns: ["laravel/*", "illuminate/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Vitest and its coverage plugin must be on the same version, majors
      # included, so they get a group of their own ahead of dev-dependencies.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Minor and patch only. A major in this group once bundled five breaking
      # upgrades with eleven safe ones, and one install conflict (TypeScript 7)
      # turned every gate red without testing any of the others. Majors now
      # arrive one PR each. Measured 2026-10-03; see the ignores below.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # src/package.json carries a hand-maintained `overrides` block for
      # postcss, sharp and nanoid with a documented rationale. Let Dependabot
      # raise the real dependency and leave the override alone, rather than
      # fighting it every week.
      - dependency-name: postcss
        update-types: [version-update:semver-patch]
      # Majors held on 2026-10-03, each for a measured reason. Lift one when
      # its reason no longer holds.
      #   typescript 7: openapi-typescript (generates src/src/api/generated.ts)
      #                 peers typescript ^5.x, so `npm ci` fails to resolve.
      #   eslint 10:    the eslint-plugin-react bundled by eslint-config-next
      #                 calls context.getFilename(), which ESLint 10 removed.
      #   msw 3:        84 of 151 test files fail; a migration, not a bump.
      #   jsdom 30:     Vitest 5's URL.createObjectURL shim reads jsdom 29's
      #                 Blob internals; three file-upload tests fail.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: msw
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
