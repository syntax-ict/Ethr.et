name: Quality gates

# CI calls scripts/gates.sh rather than restating the gate list here. The script
# is provider-neutral by design (see its header) and is already what people run
# locally, so there is exactly one definition of "does this pass" and no way for
# the two to drift.
#
# Note for anyone reading this after a confusing local failure: the elaborate
# pest-isolated.sh / phpstan-isolated.sh workarounds exist because PHP's
# recursive directory scan returns partial results over a Docker Desktop Windows
# bind mount. On a Linux runner with native PHP, gates.sh takes the have_php
# branch and none of that applies.

# `push` is the default branch only, deliberately.
#
# With `branches: ["**"]` every push to a branch that had an open PR ran the
# whole suite TWICE — once for the push event and once for the pull_request
# event. The concurrency group below did not dedupe them, because `github.ref`
# differs between the two (`refs/heads/<branch>` vs `refs/pull/<n>/merge`), so
# the groups never collided and `cancel-in-progress` never fired. Ten jobs per
# push instead of five, with the MySQL suite at ~5 minutes each — and two
# failure notifications for every real failure.
#
# `pull_request` covers every branch that matters; `push` covers main after a
# merge. A branch with no PR gets no run, which is the intended trade —
# `workflow_dispatch` is there for the exception.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# Without this, `composer install` itself fails — before any gate runs.
#
# config/broadcasting.php defaults to `reverb` when BROADCAST_CONNECTION is
# unset, and a runner has no .env. `routes/channels.php` calls
# Broadcast::channel() at load time, so `package:discover` (a post-autoload-dump
# script) builds the Reverb broadcaster, Pusher gets a null auth key, and the
# whole composer step exits 1:
#
#   Failed to create broadcaster for connection "reverb" with error:
#   Pusher\Pusher::__construct(): Argument #1 ($auth_key) must be of type
#   string, null given
#
# The quoted "null" is load-bearing. Laravel's env() parses the string "null"
# into PHP null, and broadcasting.php's `?? 'null'` then selects the null
# driver — that idiom exists for exactly this. Unquoted, YAML would make it a
# genuine null and the variable would not be set at all.
#
# CI does not run Reverb, so nothing is being masked here. phpunit.xml already
# forces the same value for the suites; this covers the composer step that runs
# before them.
env:
  BROADCAST_CONNECTION: "null"

jobs:
  backend:
    name: Backend (Pint, PHPStan, Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # The 18 the application actually needs. gd is required by
          # FileStorageService for thumbnails; fileinfo by its MIME check.
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer
          coverage: none
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # Without this the suite fails 156 tests with MissingAppKeyException.
      #
      # Employee.tin and national_id use the `encrypted` cast, and Laravel's
      # encrypter refuses to boot without APP_KEY — so every test touching an
      # employee dies, which is most of them. A runner has no .env.
      #
      # This is why `Backend suite on MySQL` passed while `Backend` failed: that
      # job already did exactly this and this one never did. Found on
      # 2026-09-16, once gates.sh started publishing the failing gate's output
      # in its annotation; the job log itself is not readable without an account.
      #
      # key:generate rather than a committed literal: an APP_KEY in the
      # repository is what `START_BACKEND.ps1` did, and removing it was logged
      # as a security fix. A fresh random key per run has the same effect here
      # and reintroduces nothing.
      - name: Generate an application key
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run backend gates
        run: ./scripts/gates.sh backend

  backend-mysql:
    name: Backend suite on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The backend job above runs the suite on SQLite :memory:. Production runs
    # on MariaDB, and until 2026-09-15 nothing had ever run the tests against
    # it. Doing so found a search defect that returned nothing in production and
    # passed every test, plus five tests that were green only because SQLite
    # reuses low row ids. A one-off run does not stop that recurring; this does.
    #
    # Runs as the non-root `ethr` user on purpose. That also exercises whether
    # the audit_log trigger migration succeeds without SUPER, which is the
    # question gate G0-F asks about the production host.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ethr_suite_mysql
          MARIADB_USER: ethr
          MARIADB_PASSWORD: ethr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer
          coverage: none
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # The encrypted casts on Employee.tin and national_id need a real APP_KEY.
      - name: Generate an application key
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.mysql.xml does not force these five, so the service container's
      # credentials win over its local defaults.
      - name: Run the backend suite against MariaDB
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ethr_suite_mysql
          DB_USERNAME: ethr
          DB_PASSWORD: ethr
        run: ./scripts/gates.sh mysql

  frontend:
    name: Frontend (i18n, Prettier, ESLint, tsc, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      # Read from .nvmrc so the toolchain version is declared once, the same
      # way CI calls gates.sh rather than restating the gate list.
      #
      # It says 24 because these jobs were pinned to "20" until 2026-09-16, and
      # Node 20 went end-of-life on 2026-04-30. That pin was not merely stale:
      # it was the whole reason `Vitest (frontend)` had never passed. Measured
      # on Linux, the same two files, in isolation:
      #
      #   Node 20 -> 3 failed    Node 22 -> 2 failed    Node 24 -> all pass
      #
      # employees-import.test.tsx posts multipart/form-data through axios, and
      # MSW's Node interceptor never returns the response on 20 or 22 — the
      # handler runs, the promise never settles, and the test dies on the
      # testing-library timeout. Nothing in the application is involved; the
      # request is intercepted before it leaves the process.
      #
      # So this bump does not weaken Node 20 coverage of the product. The other
      # frontend gates (tsc, ESLint, Prettier, i18n) always passed on 20, and
      # jsdom unit tests never exercised a production runtime anyway. What the
      # product actually needs is still Next 16's floor of Node 20.9+ — the
      # hosting question is gate B5 in the shared-hosting compatibility doc and
      # remains unanswered.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Run frontend gates
        run: ./scripts/gates.sh frontend

  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No install step: docs-link-check.cjs uses only Node built-ins, which is
      # deliberate so this can run on its own in seconds.
      - name: Check markdown links
        run: ./scripts/gates.sh docs

  backup-rehearsal-mysql:
    name: Backup restore rehearsal on MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE RESTORE PATH HAD NEVER RUN IN CI ON THE PRODUCTION DRIVER.
    #
    # BackupRestoreRehearsalTest performs the destructive round-trip — populate,
    # back up, DROP EVERY TABLE, restore, compare — and skips itself on MySQL.
    # Its guard is correct: those tests drop every table, which RefreshDatabase
    # undoes on SQLite but not on MySQL, where DDL implicitly commits and the
    # database stays destroyed for every test after it.
    #
    # The skip names `artisan ethr:backup:rehearse` as the MySQL equivalent, and
    # MIGRATION_STATE.md recorded on 2026-09-18 that it "is invoked nowhere. Not
    # by scripts/gates.sh, not by either CI workflow, not by any test". So the
    # table read:
    #
    #   SQLite   Backend                  runs
    #   MariaDB  Backend suite on MySQL   skipped, and nothing runs in its place
    #
    # Which matters because BASELINE.md §15 ranks an unverifiable restore as the
    # single largest risk in the system, above the cross-tenant defect: a product
    # with a tenant leak has a bad day; one that cannot be restored has no
    # recoverable failure mode at all. And DatabaseDumper::quoteFlat() carries its
    # own note that SQLite and MySQL quote newlines differently — a divergence
    # that already bit this project once — so "passes on SQLite" is precisely the
    # evidence that divergence defeats.
    #
    # A SEPARATE JOB, not a step on `backend-mysql`, for two reasons. The command
    # is destructive by design and leaves the database dropped when it fails, so
    # it must not share a database with the suite. And a failure here should read
    # as "the restore path broke" rather than taking the suite's result with it.
    #
    # The database is named `ethr_rehearsal` deliberately:
    # BackupRehearsalCommand::DISPOSABLE refuses to run unless the name contains
    # one of test, rehears, scratch, staging, sandbox. `ethr_suite_mysql`, which
    # the suite job uses, matches none — so this needs its own, and naming it
    # this way means the guard is satisfied honestly rather than with --force.
    #
    # Runs as the non-root `ethr` user, like the suite job, so the audit_log
    # triggers are created and re-created without SUPER — which is the question
    # G0-F asks about the production host, and which the rehearsal then verifies
    # survived the round-trip.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          # The image grants MARIADB_USER full privileges on MARIADB_DATABASE,
          # so no root grant and no mysql client are needed here.
          MARIADB_DATABASE: ethr_rehearsal
          MARIADB_USER: ethr
          MARIADB_PASSWORD: ethr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer
          coverage: none
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # Seeded, not just migrated. The command refuses a database with zero
      # tables, but migrations alone leave almost every table empty — and its
      # verification compares row counts before and after, which an empty
      # database satisfies vacuously. The reference seeders (permissions, plans,
      # tax brackets, organisation templates) are tenant-free and fast, and give
      # the comparison something to be wrong about.
      - name: Prepare a disposable database
        working-directory: api
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ethr_rehearsal
          DB_USERNAME: ethr
          DB_PASSWORD: ethr
          # .env.example selects redis for all three, which is right for the
          # local Docker stack and wrong here: this job runs no Redis service.
          # The phpunit configs `force` exactly these values, which is why the
          # test suites never hit it — and why `migrate` in the api-contract job
          # does not either, since migrations touch no cache. `db:seed` does:
          # PermissionSeeder calls Permission::clearCache(), and the first run of
          # this job died on `RedisException: Connection refused` there.
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force

      # Back up, DROP EVERY TABLE, restore, then compare tables, rows, triggers
      # and documents — and re-check that audit_log is still append-only, which
      # is the assertion the SQLite rehearsal cannot make meaningfully: it reads
      # `sqlite_master WHERE type='trigger'`, and SQLite triggers have no DEFINER
      # concept, so the one check that looks like it covers the DEFINER hazard is
      # on the one driver where that hazard cannot exist.
      - name: Rehearse backup and restore
        working-directory: api
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ethr_rehearsal
          DB_USERNAME: ethr
          DB_PASSWORD: ethr
          # .env.example selects redis for all three, which is right for the
          # local Docker stack and wrong here: this job runs no Redis service.
          # The phpunit configs `force` exactly these values, which is why the
          # test suites never hit it — and why `migrate` in the api-contract job
          # does not either, since migrations touch no cache. `db:seed` does:
          # PermissionSeeder calls Permission::clearCache(), and the first run of
          # this job died on `RedisException: Connection refused` there.
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan ethr:backup:rehearse

  api-contract:
    name: API contract (OpenAPI drift)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Needs both halves plus a migrated database: Scramble types responses by
    # reading information_schema, so the export is wrong without one.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ethr
          MARIADB_USER: ethr
          MARIADB_PASSWORD: ethr
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer
          coverage: none
          ini-values: memory_limit=-1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: |
          cd api && composer install --prefer-dist --no-interaction --no-progress
          cd ../src && npm ci

      - name: Prepare the application
        working-directory: api
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ethr
          DB_USERNAME: ethr
          DB_PASSWORD: ethr
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Check for API contract drift
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ethr
          DB_USERNAME: ethr
          DB_PASSWORD: ethr
        run: ./scripts/api-types-check.sh

  # The first backend coverage figure this project has ever had.
  #
  # Risk 10 in docs/audit/BASELINE.md has read "no coverage instrumentation"
  # since the baseline, and was half closed when the frontend was measured in
  # 2026-09-16. The backend half stayed open for one reason: it needs a PHP
  # extension. php-code-coverage 11.x ships PcovDriver and XdebugDriver and
  # nothing else, and `coverage: none` on every other job in this file is why
  # no number exists. See BASELINE 12e.
  #
  # PCOV rather than Xdebug: it is far faster and does only this, whereas Xdebug
  # slows every run it is loaded into. Its own job so the other four keep
  # `coverage: none` and stay as quick as they are.
  #
  # No threshold, deliberately. Nobody knows what the number is yet, and choosing
  # a floor before measuring one would be picking it out of the air. This prints
  # what it measured; a floor can follow once there is a baseline to set it from.
  backend-coverage:
    name: Backend coverage (PCOV)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, simplexml, tokenizer
          # The one line this whole job exists for.
          coverage: pcov
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # Same reason as the Backend job: Employee.tin and national_id use the
      # `encrypted` cast, so without APP_KEY most of the suite dies with
      # MissingAppKeyException rather than reporting coverage.
      - name: Generate an application key
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Measure backend coverage
        run: ./scripts/gates.sh coverage
