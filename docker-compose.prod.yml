# Shared definition for the three queue-worker services below. Declared at the
# top level rather than inside `services:` so it can never be mistaken for a
# service itself — Compose ignores any `x-` key, so a typo'd anchor here fails
# loudly at parse time instead of silently starting a fourth container.
x-worker-base: &worker-base
  build:
    context: .
    dockerfile: api/Dockerfile.prod
  volumes:
    - api_storage:/var/www/ethr/api/storage
  env_file:
    - ./api/.env.production
  environment:
    - DB_READ_HOST=mariadb-replica
    # Horizon runs the queued broadcasts — see the note on the api service.
    - REVERB_HOST=reverb
    - REVERB_PORT=8080
    - REVERB_SCHEME=http
    - REDIS_CACHE_HOST=redis-cache
  depends_on:
    mariadb:
      condition: service_healthy
    mariadb-replica:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    api:
      condition: service_healthy
  networks:
    - ethr-internal
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ethr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared server-block body, included by each of the three host blocks.
      # Deliberately NOT under conf.d/ — nginx auto-includes conf.d/*.conf at the
      # http level, where a bare `location` fails to parse.
      - ./infrastructure/nginx-common.conf:/etc/nginx/snippets/ethr-common.conf:ro
      - ./api/public:/var/www/ethr/api/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for ACME http-01 challenges. certbot writes into this directory
      # on the host; nginx only needs to read it back out.
      - ./infrastructure/certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ethr
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    healthcheck:
      # 127.0.0.1, not localhost — same trap as the frontend healthcheck below.
      # infrastructure/nginx.conf uses `listen 80;`, which binds IPv4 only, while
      # `localhost` resolves to ::1 first inside this image. Verified against a
      # running container: wget to localhost gets ECONNREFUSED, wget to 127.0.0.1
      # succeeds, and `getent hosts localhost` returns ::1. nginx serves every
      # request correctly the whole time, so this shows up only as a container
      # stuck "unhealthy" — which fails any `up --wait` and drops the node out of
      # a load balancer that honours container health.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    volumes:
      - api_storage:/var/www/ethr/api/storage
      - api_cache:/var/www/ethr/api/bootstrap/cache
    env_file:
      - ./api/.env.production
    environment:
      - DB_READ_HOST=mariadb-replica
      - DB_STICKY=true
      - REVERB_SCALING_ENABLED=true
      # Where clients of the WebSocket server should connect. Set here rather
      # than left to .env.production because omitting it is silent: Laravel
      # falls back to localhost and the container broadcasts to itself, so every
      # broadcast fails with "cURL error 7: Failed to connect to 127.0.0.1:8080"
      # and only surfaces later as failed jobs. (REVERB_HOST on the reverb
      # service is its *bind* address and is set on its command line.)
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      # Cache moves to its own Redis so the two instances can have the
      # maxmemory-policy each actually needs — see the redis and redis-cache
      # services, and the comment on the 'cache' connection in
      # api/config/database.php. Set here rather than in .env.production for the
      # same reason REVERB_HOST is: it is topology, and the fallback when it is
      # missing (REDIS_HOST) is silent and wrong rather than loud.
      - REDIS_CACHE_HOST=redis-cache
    depends_on:
      mariadb:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      # replicas: 1, not 2. infrastructure/nginx.conf declares a static
      # `upstream api_backend { server api:9000; }`, and nginx resolves that name
      # ONCE at startup: with two replicas Compose's DNS returns two addresses
      # and nginx pins to whichever it saw first, so the second container served
      # nothing while still consuming its CPU and memory reservations. The
      # existing `dc restart nginx` in scripts/deploy.sh (">> Restarting Nginx
      # (refreshes cached upstream container IPs)") is the workaround for the
      # same root cause. Real horizontal scale needs `resolver 127.0.0.11
      # valid=10s;` plus a variable-based fastcgi_pass — a deliberate change,
      # not a number bumped here.
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # ── Queue workers ───────────────────────────────────────────────────────────
  #
  # Three containers, not one `worker` at replicas: 2. config/horizon.php defines
  # six supervisors totalling 23 processes; running all of them in a single 1G
  # container (twice over) was an OOM kill waiting for a busy month-end, and it
  # put supervisor-payroll's 1800-second jobs in the same cgroup as
  # supervisor-attendance, whose entire point is the 30-second wait threshold in
  # config/horizon.php.
  #
  # Every `memory:` below is derived from that file's per-supervisor `memory`
  # option x its `maxProcesses`, plus ~256 MB for the master supervisor process.
  # The two must be changed together: Docker OOM-kills the container before
  # Horizon's own per-worker cap can apply, so a container whose limit is under
  # its supervisors' ceiling dies instead of recycling a worker. Note that
  # `horizon.memory_limit` is NOT that ceiling — it governs the master process
  # only, and reading it as a worker cap is what mis-sized this the first time.
  #
  # All three share the `x-worker-base` anchor at the top of this file — one
  # image, one environment; only the --environment flag, the resource limits and
  # the healthcheck differ. See the block comment above `environments` in
  # config/horizon.php for the naming contract —
  # in short, a name that matches no key there starts cleanly and silently
  # processes nothing, which is what each healthcheck's grep exists to catch.

  # attendance, devices, sync — someone or something is waiting on these.
  # Ceiling: attendance 6x128 + sync 4x192 = 1536 MB, +256 master = 1792 MB.
  worker-realtime:
    <<: *worker-base
    command: php artisan horizon --environment=production-realtime
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      # Not `horizon:status`: that inspects every master registered in Redis,
      # cluster-wide, so any one healthy worker container makes all three report
      # healthy. Grepping for a supervisor only this container is configured to
      # run is what makes the probe about *this* container.
      test: ["CMD-SHELL", "php artisan horizon:supervisors | grep -q supervisor-attendance"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # notifications, mail, sms, default — high volume, nothing blocked on it.
  # Ceiling: notifications 5x128 + default 3x128 = 1024 MB, +256 master = 1280.
  # This is the one limit that went UP rather than down once the real per-worker
  # figures were declared: at 1G it sat *below* its own ceiling, which is the
  # same defect as the original single worker container, just smaller.
  worker-notifications:
    <<: *worker-base
    command: php artisan horizon --environment=production-notifications
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:supervisors | grep -q supervisor-notifications"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # payroll, exports — long and memory-hungry, and isolated so that is fine.
  # Ceiling: payroll 3x384 + exports 2x256 = 1664 MB, +256 master = 1920 MB.
  # Only 5 processes, yet nearly as much memory as worker-realtime's 10, because
  # these are the only supervisors given more than the 128 MB default — payroll
  # was previously stuck at it and recycled itself part-way through a run. The
  # per-worker cap is also checked BETWEEN jobs, so an 1800-second payroll job
  # grows unchecked for its whole duration; the slack between this ceiling and
  # the limit below is what absorbs that. `nice` buys CPU priority, never RAM,
  # which is why isolating these was the fix rather than de-prioritising them.
  worker-heavy:
    <<: *worker-base
    command: php artisan horizon --environment=production-heavy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          # 384 MB above the 1920 MB ceiling — one extra payroll worker's worth.
          # The other two containers get 256 MB of slack; this one gets more
          # because it is the only place a single job runs long enough to grow
          # past its cap before the between-jobs check can recycle it.
          memory: 2304M
    healthcheck:
      # start_period covers the 1800s payroll timeout only in the sense that the
      # supervisor registers immediately; a long-running job does not deregister
      # it, so this stays accurate mid-run.
      test: ["CMD-SHELL", "php artisan horizon:supervisors | grep -q supervisor-payroll"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    container_name: ethr-scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - api_storage:/var/www/ethr/api/storage
    env_file:
      - ./api/.env.production
    environment:
      # Scheduled commands broadcast too — see the note on the api service.
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REDIS_CACHE_HOST=redis-cache
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  reverb:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - api_storage:/var/www/ethr/api/storage
    env_file:
      - ./api/.env.production
    environment:
      - REVERB_SCALING_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      # replicas: 1, for the same reason as the api service — `upstream
      # reverb_backend { server reverb:8080; }` in infrastructure/nginx.conf is
      # resolved once at startup, so a second replica received no connections.
      # Note the `ip_hash` on that upstream was likewise inert: it balances
      # between the addresses nginx knows about, and it only ever knew one.
      # REVERB_SCALING_ENABLED below is still correct and still required — it is
      # what lets a broadcast published by the api container reach a client held
      # open by this one, which is a separate concern from load balancing.
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    build:
      context: ./src
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ethr.et}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ETHR}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ethr.et}
        # Setting this makes the hostname the tenant selector: the apex login
        # form routes to {tenant}.{root} instead of authenticating, and the SPA
        # stops sending X-Tenant (which the API refuses outside local/testing).
        # Leave it unset for single-host development on localhost.
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-ethr.et}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-ethr.et}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
        # Must equal REVERB_APP_KEY in api/.env.production. Deliberately has no
        # `:-` default: src/lib/echo.ts already falls back to the literal
        # "ethr-key", so a default here would just make an unset value look
        # deliberate while every WebSocket handshake fails against the real
        # server key. Left empty, the build still succeeds — see the ARG comment
        # in docker/frontend/Dockerfile for why nothing catches that.
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./src/.env.production
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      # 127.0.0.1, not localhost. docker/frontend/Dockerfile sets HOSTNAME=0.0.0.0
      # and Next's standalone server binds IPv4 only, but `localhost` resolves to
      # ::1 first inside this image — so the probe gets ECONNREFUSED forever while
      # the server is serving fine. The container then never reports healthy, and
      # nginx (depends_on: frontend: condition: service_healthy) never starts.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:10.11
    container_name: ethr-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-ethr}
      MARIADB_USER: ${DB_USERNAME:-ethr}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mariadb-replica:
    image: mariadb:10.11
    container_name: ethr-mariadb-replica
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-ethr}
      MARIADB_USER: ${DB_READ_USERNAME:-ethr_read}
      MARIADB_PASSWORD: ${DB_READ_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mariadb_replica_data:/var/lib/mysql
      - ./docker/mariadb/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          # 2x replica.cnf's innodb_buffer_pool_size (768M), matching the ratio
          # the primary already runs at (1G pool / 2G limit). This was 1G — only
          # 1.3x — and InnoDB's resident footprint is not the buffer pool alone:
          # add the log buffer, the dictionary cache, tmp_table_size (64M) and
          # per-connection buffers across max_connections=200 and it lands
          # 25-40% above the pool, i.e. ~960M-1.07G against a hard 1G cap.
          #
          # The kernel then OOM-kills mariadbd mid-init, `restart: always`
          # bounces it, and the container never reaches healthy. Because api,
          # scheduler, the workers and nginx all gate on
          # `mariadb-replica: condition: service_healthy`, one OOM takes the
          # whole stack down with it. It fires only when init does enough work
          # to cross the cap, so it reproduces intermittently: a
          # scripts/prod-build-test.sh run failed 38/48 this way and the very
          # next run passed 48/48 on identical images.
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis, split in two ─────────────────────────────────────────────────────
  #
  # `maxmemory-policy` is instance-wide: it does not respect the database split
  # (queue/sessions/locks on REDIS_DB=0, cache on REDIS_CACHE_DB=1). One
  # instance serving both therefore has no correct setting, only a least-bad
  # one, and this service previously ran `volatile-lru` as that compromise:
  # eviction restricted to keys with a TTL, so cache pressure could not reach
  # the queue — but a cache that filled would then start refusing writes,
  # because the single memory budget was shared with data that must never be
  # dropped.
  #
  # Two containers dissolve the tradeoff instead of balancing it. Nothing about
  # the application changes except where the `cache` connection points
  # (REDIS_CACHE_HOST, set on api/worker-*/scheduler; see the comment on that
  # connection in api/config/database.php).
  #
  # Note that Laravel puts cache LOCKS on the `default` connection, not the
  # cache one (config/cache.php: 'lock_connection' => 'default'). So every
  # withoutOverlapping() mutex in routes/console.php stays here, on the
  # non-evicting instance, where an evicted key would have meant a second
  # concurrent accrue-leave-balances run rather than a cache miss.

  # Queue, sessions, cache locks, Horizon metadata, Reverb scaling pub/sub.
  # noeviction: none of this has a TTL that makes it safe to drop, and a full
  # instance must fail a write loudly rather than silently discard a queued
  # payroll run. Persisted, because losing it loses committed work.
  redis:
    image: redis:7-alpine
    container_name: ethr-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Cache only. allkeys-lru is now the *correct* policy rather than a hazard:
  # everything in here is derived data that regenerates on a miss, so evicting
  # the coldest key under pressure is the desired behaviour.
  #
  # No volume and no appendonly, deliberately — persisting a cache buys nothing
  # but a slower restart and a disk that fills. A cold start after a deploy is
  # the intended cost.
  redis-cache:
    image: redis:7-alpine
    container_name: ethr-redis-cache
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  minio:
    # Pinned like every other image here: `latest` made this the one service
    # whose behaviour could change under an unrelated `docker compose pull`.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ethr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mariadb_data:
  mariadb_replica_data:
  redis_data:
  minio_data:
  api_storage:
  api_cache:

networks:
  ethr:
    driver: bridge
  ethr-internal:
    driver: bridge
    internal: true
