# ============================================================================
# FIXED 2026-09-22. This stack ran `php artisan horizon` until today and could
# not start a worker: Horizon was removed in cdf85d1 and is absent from
# composer.lock (0 occurrences), so every worker container exited immediately
# with "Command 'horizon' is not defined" while `restart: always` turned that
# into a crashloop.
#
# WHY IT WAS FIXED NOW. It was left broken deliberately while the VPS was the
# thing this project was migrating AWAY from. The pre-registered decision rule
# in docs/SHARED_HOSTING_MIGRATION_PLAN.md fired on G0-D (no Scheduled Tasks on
# the shared host) and returned No-Go -> Option A, and Option A is "stay on the
# VPS". This stack is therefore the LIVE production path, not a fallback.
#
# WHAT REPLACED THE THREE-WAY PARTITION. The old split was attendance/devices/
# sync, notifications, payroll. Three of those queues DO NOT EXIST: the
# application dispatches onto exactly four, QueueHealth::QUEUES = default,
# attendance, notifications, exports. So the old topology would have left
# `default` and `exports` undrained even with Horizon present.
#
# Two services now, split by latency rather than by queue name:
#
#   worker-realtime   attendance,notifications,default   someone is waiting
#   worker-exports    exports                            long and memory-hungry
#
# Queue ORDER on the command line is meaningful -- Laravel drains left to right,
# which is why `attendance` leads. Membership is the correctness property: every
# queue in QueueHealth::QUEUES appears in exactly one of the two lines, so
# nothing dispatched goes undrained. DeploymentWorkerConsistencyTest pins that.
#
# MEMORY IS SIZED DIFFERENTLY NOW, and the old figures do not carry over.
# Horizon ran N worker PROCESSES per container under one master, so its ceilings
# were N x per-worker + master. A plain `queue:work` is ONE process. Concurrency
# therefore comes from `replicas`, and each container is sized for a single
# worker plus headroom. `--memory` is the in-process cap Laravel checks BETWEEN
# jobs; the container limit sits above it so a job that grows mid-run is not
# OOM-killed before that check can recycle the worker.
# ============================================================================

# Shared definition for the three queue-worker services below. Declared at the
# top level rather than inside `services:` so it can never be mistaken for a
# service itself — Compose ignores any `x-` key, so a typo'd anchor here fails
# loudly at parse time instead of silently starting a fourth container.
x-worker-base: &worker-base
  build:
    context: .
    dockerfile: api/Dockerfile.prod
  volumes:
    - api_storage:/var/www/ethr/api/storage
  env_file:
    - ./api/.env.production
  environment:
    - DB_READ_HOST=mariadb-replica
    # Queued broadcasts run here — see the note on the api service.
    - REVERB_HOST=reverb
    - REVERB_PORT=8080
    - REVERB_SCHEME=http
    - REDIS_CACHE_HOST=redis-cache
  depends_on:
    mariadb:
      condition: service_healthy
    mariadb-replica:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    api:
      condition: service_healthy
  networks:
    - ethr-internal
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ethr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared server-block body, included by each of the three host blocks.
      # Deliberately NOT under conf.d/ — nginx auto-includes conf.d/*.conf at the
      # http level, where a bare `location` fails to parse.
      - ./infrastructure/nginx-common.conf:/etc/nginx/snippets/ethr-common.conf:ro
      - ./api/public:/var/www/ethr/api/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for ACME http-01 challenges. certbot writes into this directory
      # on the host; nginx only needs to read it back out.
      - ./infrastructure/certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ethr
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    healthcheck:
      # 127.0.0.1, not localhost — same trap as the frontend healthcheck below.
      # infrastructure/nginx.conf uses `listen 80;`, which binds IPv4 only, while
      # `localhost` resolves to ::1 first inside this image. Verified against a
      # running container: wget to localhost gets ECONNREFUSED, wget to 127.0.0.1
      # succeeds, and `getent hosts localhost` returns ::1. nginx serves every
      # request correctly the whole time, so this shows up only as a container
      # stuck "unhealthy" — which fails any `up --wait` and drops the node out of
      # a load balancer that honours container health.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    volumes:
      - api_storage:/var/www/ethr/api/storage
      - api_cache:/var/www/ethr/api/bootstrap/cache
    env_file:
      - ./api/.env.production
    environment:
      - DB_READ_HOST=mariadb-replica
      - DB_STICKY=true
      - REVERB_SCALING_ENABLED=true
      # Where clients of the WebSocket server should connect. Set here rather
      # than left to .env.production because omitting it is silent: Laravel
      # falls back to localhost and the container broadcasts to itself, so every
      # broadcast fails with "cURL error 7: Failed to connect to 127.0.0.1:8080"
      # and only surfaces later as failed jobs. (REVERB_HOST on the reverb
      # service is its *bind* address and is set on its command line.)
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      # Cache moves to its own Redis so the two instances can have the
      # maxmemory-policy each actually needs — see the redis and redis-cache
      # services, and the comment on the 'cache' connection in
      # api/config/database.php. Set here rather than in .env.production for the
      # same reason REVERB_HOST is: it is topology, and the fallback when it is
      # missing (REDIS_HOST) is silent and wrong rather than loud.
      - REDIS_CACHE_HOST=redis-cache
    depends_on:
      mariadb:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      # replicas: 1, not 2. infrastructure/nginx.conf declares a static
      # `upstream api_backend { server api:9000; }`, and nginx resolves that name
      # ONCE at startup: with two replicas Compose's DNS returns two addresses
      # and nginx pins to whichever it saw first, so the second container served
      # nothing while still consuming its CPU and memory reservations. The
      # existing `dc restart nginx` in scripts/deploy.sh (">> Restarting Nginx
      # (refreshes cached upstream container IPs)") is the workaround for the
      # same root cause. Real horizontal scale needs `resolver 127.0.0.11
      # valid=10s;` plus a variable-based fastcgi_pass — a deliberate change,
      # not a number bumped here.
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"

  # ── Queue workers ───────────────────────────────────────────────────────────
  #
  # Two containers, split by LATENCY rather than by queue name. The previous
  # three-way split was inherited from config/horizon.php, which no longer
  # exists: Horizon was removed in cdf85d1, and with it the six supervisors and
  # 23 processes those limits were derived from.
  #
  # Both share the `x-worker-base` anchor at the top of this file — one image,
  # one environment; only the --queue list, the replica count, the resource
  # limits and nothing else differ.
  #
  # SIZING, which does NOT follow the old arithmetic. Horizon ran N worker
  # processes per container under one master, so each limit was
  # per-supervisor-memory x maxProcesses + ~256 MB for the master. A plain
  # `queue:work` is ONE process per container, so concurrency comes from
  # `replicas` and each limit covers a single worker plus headroom.
  #
  # `--memory` and the container limit must still be changed together, for the
  # reason the old comment gave and which has not changed: Docker OOM-kills the
  # container before Laravel's own cap can apply, so a limit set at or under
  # `--memory` dies instead of recycling the worker. Every limit below sits
  # above its `--memory`, and the gap is the slack a job can grow into between
  # the between-jobs checks.
  #
  # Keeping the queues isolated is still the point: an export that runs for
  # minutes must not share a cgroup with attendance, whose whole value is being
  # picked up promptly.

  # attendance, notifications, default — someone or something is waiting on
  # these, so they share one worker and `attendance` is drained first.
  # One process per replica; 4 replicas x 384 MB = 1536 MB.
  worker-realtime:
    <<: *worker-base
    command: >
      php artisan queue:work
      --queue=attendance,notifications,default
      --tries=3 --backoff=10 --max-time=3600 --memory=256
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2'
          # 128 MB above --memory=256, so a job that grows between the
          # between-jobs memory checks is recycled rather than OOM-killed.
          memory: 384M
    healthcheck:
      # Was `horizon:supervisors | grep -q supervisor-attendance`, which needed
      # a command that no longer exists. This checks THIS container's own
      # process table, which is what the old comment said it wanted: the
      # previous alternative, `horizon:status`, inspected every master
      # registered in Redis cluster-wide, so one healthy container made them
      # all report healthy.
      #
      # The bracket in `queue:wor[k]` is load-bearing: without it the probe's
      # OWN shell has the pattern in its argv and the check passes even with no
      # worker running. Verified by running both forms against a container with
      # and without a worker.
      test: ["CMD-SHELL", "grep -q 'queue:wor[k]' /proc/[0-9]*/cmdline 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # exports — long and memory-hungry, isolated so a slow export cannot delay
  # anything a user is waiting on. 2 replicas x 768 MB = 1536 MB.
  worker-exports:
    <<: *worker-base
    command: >
      php artisan queue:work
      --queue=exports
      --tries=3 --backoff=10 --max-time=3600 --memory=512
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          # 256 MB of slack rather than 128: this is the only place a single job
          # runs long enough to grow well past its cap before the between-jobs
          # check can act.
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'queue:wor[k]' /proc/[0-9]*/cmdline 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    container_name: ethr-scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - api_storage:/var/www/ethr/api/storage
    env_file:
      - ./api/.env.production
    environment:
      # Scheduled commands broadcast too — see the note on the api service.
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REDIS_CACHE_HOST=redis-cache
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  reverb:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - api_storage:/var/www/ethr/api/storage
    env_file:
      - ./api/.env.production
    environment:
      - REVERB_SCALING_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      # replicas: 1, for the same reason as the api service — `upstream
      # reverb_backend { server reverb:8080; }` in infrastructure/nginx.conf is
      # resolved once at startup, so a second replica received no connections.
      # Note the `ip_hash` on that upstream was likewise inert: it balances
      # between the addresses nginx knows about, and it only ever knew one.
      # REVERB_SCALING_ENABLED below is still correct and still required — it is
      # what lets a broadcast published by the api container reach a client held
      # open by this one, which is a separate concern from load balancing.
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  frontend:
    build:
      context: ./src
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ethr.et}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ETHR}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ethr.et}
        # Setting this makes the hostname the tenant selector: the apex login
        # form routes to {tenant}.{root} instead of authenticating, and the SPA
        # stops sending X-Tenant (which the API refuses outside local/testing).
        # Leave it unset for single-host development on localhost.
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-ethr.et}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-ethr.et}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
        # Must equal REVERB_APP_KEY in api/.env.production. Deliberately has no
        # `:-` default: src/lib/echo.ts already falls back to the literal
        # "ethr-key", so a default here would just make an unset value look
        # deliberate while every WebSocket handshake fails against the real
        # server key. Left empty, the build still succeeds — see the ARG comment
        # in docker/frontend/Dockerfile for why nothing catches that.
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./src/.env.production
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      # 127.0.0.1, not localhost. docker/frontend/Dockerfile sets HOSTNAME=0.0.0.0
      # and Next's standalone server binds IPv4 only, but `localhost` resolves to
      # ::1 first inside this image — so the probe gets ECONNREFUSED forever while
      # the server is serving fine. The container then never reports healthy, and
      # nginx (depends_on: frontend: condition: service_healthy) never starts.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:10.11
    container_name: ethr-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-ethr}
      MARIADB_USER: ${DB_USERNAME:-ethr}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mariadb-replica:
    image: mariadb:10.11
    container_name: ethr-mariadb-replica
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-ethr}
      MARIADB_USER: ${DB_READ_USERNAME:-ethr_read}
      MARIADB_PASSWORD: ${DB_READ_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mariadb_replica_data:/var/lib/mysql
      - ./docker/mariadb/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          # 2x replica.cnf's innodb_buffer_pool_size (768M), matching the ratio
          # the primary already runs at (1G pool / 2G limit). This was 1G — only
          # 1.3x — and InnoDB's resident footprint is not the buffer pool alone:
          # add the log buffer, the dictionary cache, tmp_table_size (64M) and
          # per-connection buffers across max_connections=200 and it lands
          # 25-40% above the pool, i.e. ~960M-1.07G against a hard 1G cap.
          #
          # The kernel then OOM-kills mariadbd mid-init, `restart: always`
          # bounces it, and the container never reaches healthy. Because api,
          # scheduler, the workers and nginx all gate on
          # `mariadb-replica: condition: service_healthy`, one OOM takes the
          # whole stack down with it. It fires only when init does enough work
          # to cross the cap, so it reproduces intermittently: a
          # scripts/prod-build-test.sh run failed 38/48 this way and the very
          # next run passed 48/48 on identical images.
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis, split in two ─────────────────────────────────────────────────────
  #
  # `maxmemory-policy` is instance-wide: it does not respect the database split
  # (queue/sessions/locks on REDIS_DB=0, cache on REDIS_CACHE_DB=1). One
  # instance serving both therefore has no correct setting, only a least-bad
  # one, and this service previously ran `volatile-lru` as that compromise:
  # eviction restricted to keys with a TTL, so cache pressure could not reach
  # the queue — but a cache that filled would then start refusing writes,
  # because the single memory budget was shared with data that must never be
  # dropped.
  #
  # Two containers dissolve the tradeoff instead of balancing it. Nothing about
  # the application changes except where the `cache` connection points
  # (REDIS_CACHE_HOST, set on api/worker-*/scheduler; see the comment on that
  # connection in api/config/database.php).
  #
  # Note that Laravel puts cache LOCKS on the `default` connection, not the
  # cache one (config/cache.php: 'lock_connection' => 'default'). So every
  # withoutOverlapping() mutex in routes/console.php stays here, on the
  # non-evicting instance, where an evicted key would have meant a second
  # concurrent accrue-leave-balances run rather than a cache miss.

  # Queue, sessions, cache locks, Horizon metadata, Reverb scaling pub/sub.
  # noeviction: none of this has a TTL that makes it safe to drop, and a full
  # instance must fail a write loudly rather than silently discard a queued
  # payroll run. Persisted, because losing it loses committed work.
  redis:
    image: redis:7-alpine
    container_name: ethr-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Cache only. allkeys-lru is now the *correct* policy rather than a hazard:
  # everything in here is derived data that regenerates on a miss, so evicting
  # the coldest key under pressure is the desired behaviour.
  #
  # No volume and no appendonly, deliberately — persisting a cache buys nothing
  # but a slower restart and a disk that fills. A cold start after a deploy is
  # the intended cost.
  redis-cache:
    image: redis:7-alpine
    container_name: ethr-redis-cache
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 640M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  minio:
    # Pinned like every other image here: `latest` made this the one service
    # whose behaviour could change under an unrelated `docker compose pull`.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ethr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ethr-internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mariadb_data:
  mariadb_replica_data:
  redis_data:
  minio_data:
  api_storage:
  api_cache:

networks:
  ethr:
    driver: bridge
  ethr-internal:
    driver: bridge
    internal: true
