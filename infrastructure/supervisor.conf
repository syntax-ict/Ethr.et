[program:ethr-horizon]
command=php /var/www/ethr/api/artisan horizon
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/ethr/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:ethr-scheduler]
command=/bin/bash -c "while true; do php /var/www/ethr/api/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/ethr/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[program:ethr-reverb]
command=php /var/www/ethr/api/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/ethr/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[group:ethr]
programs=ethr-horizon,ethr-scheduler,ethr-reverb
