# Was `artisan horizon` until 2026-09-19. Horizon was removed from the project
# in cdf85d1 -- it is absent from composer.json and composer.lock and there is no
# config/horizon.php -- so this line invoked a command the application does not
# define. Supervisor would retry it startretries=5 times and then give up,
# leaving the VPS with no queue worker at all while every other process looked
# healthy. Nothing detected it because nobody started the VPS stack after the
# removal.
#
# --queue is explicit and ordered. A bare `queue:work` reads only `default`, and
# this application dispatches onto four queues; QueueHealth::QUEUES is the
# authoritative list and this line must match it. Earlier names are drained
# first, so `attendance` (someone is standing at a device) precedes `exports`
# (someone is waiting for an email).
#
# --max-time recycles the process hourly: a long-lived worker holds the code it
# booted with, so without this a deploy does not reach the queue until the
# machine is restarted.
[program:ethr-queue]
command=php /var/www/ethr/api/artisan queue:work --queue=attendance,notifications,default,exports --tries=3 --backoff=10 --max-time=3600
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/ethr/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:ethr-scheduler]
command=/bin/bash -c "while true; do php /var/www/ethr/api/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/ethr/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[program:ethr-reverb]
command=php /var/www/ethr/api/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
startretries=5
startsecs=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/ethr/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[group:ethr]
programs=ethr-queue,ethr-scheduler,ethr-reverb
