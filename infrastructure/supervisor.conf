[program:ethr-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ethr/api/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/ethr/worker.log
stopwaitsecs=3600

[program:ethr-scheduler]
command=/bin/bash -c "while true; do php /var/www/ethr/api/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ethr/scheduler.log

[program:ethr-reverb]
command=php /var/www/ethr/api/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ethr/reverb.log

[program:ethr-horizon]
command=php /var/www/ethr/api/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ethr/horizon.log

[group:ethr]
programs=ethr-worker,ethr-scheduler,ethr-reverb,ethr-horizon
