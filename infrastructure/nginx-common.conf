# Shared server-block body for every ETHR hostname.
#
# Included from each `server { … }` in nginx.conf — public, platform admin and
# tenant — so the three blocks differ only where they are *meant* to differ
# (server_name, logs, and which paths each host refuses). Duplicating ~100 lines
# of TLS, headers and locations three times is how those blocks drift apart.
#
# Mounted at /etc/nginx/snippets/, NOT /etc/nginx/conf.d/: the stock nginx.conf
# auto-includes conf.d/*.conf at the http level, where a bare `location` is a
# syntax error.

# TLS — one wildcard certificate covers ethr.et, admin.ethr.et and every tenant.
ssl_certificate /etc/letsencrypt/live/ethr.et/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ethr.et/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

# Security headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:;" always;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
gzip_min_length 1024;

client_max_body_size 50M;

# Static assets
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header replaces rather than merges inherited headers, so the ones that
    # still matter for cached assets are re-asserted here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
}

# Sanctum CSRF cookie endpoint (Laravel, not the frontend)
location /sanctum {
    try_files $uri $uri/ /index.php?$query_string;
}

location /api {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    fastcgi_pass api_backend;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 30;
}

# Frontend (Next.js). Host is preserved deliberately — it is what Laravel's
# ResolveTenant reads to identify the tenant, and what Next.js middleware reads
# to pick public / platform / tenant context.
location / {
    proxy_pass http://frontend_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# WebSocket (Reverb). `/app` is Reverb's own client path — not `/ws`.
location /app {
    proxy_pass http://reverb_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Granular rate limiting per CLAUDE.md policy
location ~ ^/api/v1/auth/login$ {
    limit_req zone=login burst=3 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/api/v1/payroll {
    limit_req zone=heavy burst=1 nodelay;
    try_files $uri $uri/ @payroll_php;
}

location @payroll_php {
    fastcgi_pass api_backend;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    include fastcgi_params;
    fastcgi_read_timeout 120;
}

location ~ ^/api/v1/employees/import {
    limit_req zone=heavy burst=3 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ ^/api/v1/ {
    limit_req zone=api burst=20 nodelay;
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ /\. {
    deny all;
}
