server_tokens off;

upstream api_backend {
    least_conn;
    server api:9000;
}

upstream frontend_backend {
    least_conn;
    server frontend:3000;
}

upstream reverb_backend {
    ip_hash;
    server reverb:8080;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=heavy:10m rate=2r/m;

# ── :80 — redirect everything, for every hostname ───────────────────────────
server {
    listen 80;
    server_name ethr.et admin.ethr.et *.ethr.et;

    # Container liveness probe. This deliberately does NOT redirect: the compose
    # healthcheck runs `wget` from inside the container against `localhost`, so a
    # 301 to https://localhost/... would be answered with the *.ethr.et
    # certificate and fail hostname verification, leaving nginx permanently
    # "unhealthy". Upstream health is already covered by the api service's own
    # `php artisan health:check`; this endpoint only answers "is nginx serving?".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ACME http-01 challenge must be reachable over plain HTTP for any
    # non-wildcard certificate to renew. Wildcards still require dns-01 —
    # see docs/DEPLOYMENT.md.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Three hostnames, three server blocks.
#
#   ethr.et         public / marketing   — no tenant, no admin console
#   admin.ethr.et   platform admin       — super admin only, never a tenant
#   *.ethr.et       tenant application   — tenant resolved from the hostname
#
# nginx prefers an exact server_name over a wildcard, so admin.ethr.et is served
# by its own block and never falls through to *.ethr.et. `*.ethr.et` matches a
# single label only, which is also all the wildcard certificate covers.
#
# The split exists so host-level controls are *possible*: distinct access logs,
# and the ability to refuse the admin console anywhere except the platform host.
# Before it, one block served all three and no such distinction could be made.
# ─────────────────────────────────────────────────────────────────────────────

# ── Public / marketing ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ethr.et;

    root /var/www/ethr/api/public;
    index index.php;

    include /etc/nginx/snippets/ethr-common.conf;

    # The console belongs to admin.ethr.et. Note this cannot shadow the admin
    # *API*: `^~ /admin` matches only paths beginning /admin, and the API lives
    # under /api/v1/admin.
    location ^~ /admin {
        return 404;
    }

    access_log /var/log/nginx/ethr_public_access.log;
    error_log /var/log/nginx/ethr_public_error.log;
}

# ── Platform administration ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.ethr.et;

    root /var/www/ethr/api/public;
    index index.php;

    include /etc/nginx/snippets/ethr-common.conf;

    # Tenant application routes are turned away by the Next.js middleware rather
    # than here: the admin console shares the app shell, so a blanket nginx deny
    # would break the console's own navigation. `admin` is a reserved subdomain
    # (Tenant::RESERVED_SUBDOMAINS), so this host can never resolve to a tenant
    # and BelongsToTenant degrades to WHERE 0 = 1 on anything tenant-scoped.
    #
    # Separate logs are the point of this block existing — platform-admin
    # activity should be auditable without grepping tenant traffic.
    access_log /var/log/nginx/ethr_admin_access.log;
    error_log /var/log/nginx/ethr_admin_error.log;
}

# ── Tenant applications ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name *.ethr.et;

    root /var/www/ethr/api/public;
    index index.php;

    # The tenant's public landing page, served by Laravel rather than Next.
    #
    # `location = /` is an exact match, so it takes precedence over the
    # snippet's prefix `location /` without modifying it — every other path on
    # a tenant host (/login, /dashboard, the Next assets) still proxies to the
    # frontend exactly as before. This block is inside the *.ethr.et server
    # only: the apex keeps serving the ETHR marketing site at `/`, and
    # admin.ethr.et keeps serving the console.
    #
    # Before this, `habru.ethr.et/` rendered the ETHR corporate marketing page,
    # because nothing distinguished `/` by host.
    #
    # Laravel answers 404 here unless APP_DOMAIN is set, the host names an
    # active tenant, and that tenant has published a page — so adding this
    # location changes nothing for a tenant that has not opted in.
    location = / {
        try_files $uri /index.php?$query_string;
    }

    # Tenant logo and hero image, streamed from storage by Laravel. Kept off
    # `/assets/` so it cannot shadow the landing page's own static files.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    include /etc/nginx/snippets/ethr-common.conf;

    # The platform console is not served on a tenant hostname. Authorization
    # already refuses the data (Gate::authorize('admin.manage')); this refuses
    # the surface, so a missing gate on some future admin screen cannot be
    # reached from a tenant host at all.
    location ^~ /admin {
        return 404;
    }

    access_log /var/log/nginx/ethr_tenant_access.log;
    error_log /var/log/nginx/ethr_tenant_error.log;
}
