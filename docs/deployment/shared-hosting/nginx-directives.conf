# ── Why this file exists ────────────────────────────────────────────────────
#
# docs/B1-B5_GATE_REPORT.md recorded the live response headers on this account
# as `Server: nginx`. That is not a verdict — Plesk very commonly runs nginx in
# front of Apache, and in that arrangement `.htaccess` works normally. But it is
# also how a host looks when nginx serves the document root by itself, and in
# THAT arrangement every directive in `.htaccess` is ignored with no error, no
# warning and no log line.
#
# So there are two possible worlds and one canary (scripts/hosting-verification/
# htaccess-canary/) that distinguishes them. This file is what you paste if the
# canary says we are in the second one. Writing it now costs an hour. Writing it
# after the canary fails costs the deployment window, because the person doing
# it will be translating Apache rewrite semantics into nginx location semantics
# at the worst possible moment.
#
# ── Where it goes ───────────────────────────────────────────────────────────
#
#   Plesk → Domains → <domain> → Apache & nginx Settings
#        → "Additional nginx directives"
#
# ⚠ ON THIS ACCOUNT THAT FIELD APPEARS NOT TO EXIST. The owner read that page
# on 2026-09-17 and reported neither an "Additional directives for HTTP/HTTPS"
# nor an "Additional nginx directives" textarea, on an otherwise complete page.
# In Plesk both are gated by a service-plan permission. That is recorded as
# blocker B-2 in docs/MIGRATION_STATE.md and as the evidence behind G0-A.
#
# The status is "strong evidence of FAIL, UNCONFIRMED" — not a measured
# absence. Confirm it by reading the bottom of that page before concluding
# anything. But do not plan around pasting this file until you have: on the
# current evidence there is nowhere to paste it, which makes this file a
# prepared answer rather than an available remedy. If the field really is
# absent, the route is the higher-plans ask of
# deployment/ETHIO-TELECOM-SUPPORT-REQUEST.md, not this file.
#
# Plesk inserts the contents into the `server { }` block of the generated vhost,
# for both the :80 and :443 servers. Save, then let Plesk reload; a syntax error
# is rejected at save time with the nginx error, which is the one piece of
# fast feedback this exercise gives you.
#
# ── What this file deliberately does NOT translate ──────────────────────────
#
# **Routing.** The `.htaccess` rewrites `/api/*` and `/sanctum/*` to Laravel's
# front controller. There is no safe blind translation of that, because the
# correct nginx form depends entirely on something Gate 0 has not measured:
#
#   - If nginx proxies to Apache (Plesk's default), routing already works and
#     needs nothing here. Adding a `location` block for PHP would take the
#     request AWAY from Apache and break it.
#   - If nginx serves the root directly, routing needs a `fastcgi_pass` to the
#     right PHP-FPM socket — whose path is per-domain, per-PHP-version, and
#     which G0-B has not read.
