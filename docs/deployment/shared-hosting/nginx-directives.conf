# Guessing between those is how you turn a silent header problem into a total
# outage. Routing failure is also the one failure in this whole file that is
# LOUD: the API returns 404 and someone notices in seconds. Leave it until the
# canary says which world we are in, then write the four lines that are right.
#
# Everything below covers the half that fails SILENTLY — headers that simply
# stop being sent, and files that simply start being served.

# ═══════════════════════════════════════════════════════════════════════════
# 1. Security headers
# ═══════════════════════════════════════════════════════════════════════════
#
# Byte-identical in content to the `.htaccess` `mod_headers` block — verified
# 2026-09-25, both CSP strings compared character for character. That half of
# the chain holds and matters: these two files are the shared-hosting pair, and
# they must not drift from each other.
#
# **The rest of the sentence was false and is gone.** It continued "...which is
# in turn byte-identical to infrastructure/nginx-common.conf, so a security scan
# against this deployment matches the one already run against the VPS." The two
# CSPs differ in six places and this pair is the stricter — it adds
# frame-ancestors, base-uri and form-action, which nginx never carried, and
# drops `wss:` because Reverb is not deployed here. See the `.htaccess`
# response-headers block for the measured diff.
#
# So: a VPS security scan does not transfer. Scan this deployment.
#
# ┌─ THE TRAP ─────────────────────────────────────────────────────────────┐
# │ nginx `add_header` does NOT inherit into a `location` that has an       │
# │ `add_header` of its own. Not "is overridden by" — the entire            │
# │ server-level set is dropped for that location, silently.                │
# │                                                                         │
# │ Plesk's generated config routinely puts `add_header` inside static-file │
# │ locations. So proving these headers arrive on ONE url proves nothing    │
# │ about the others. Verify on three: an HTML route, a `/_next/static/*`   │
# │ asset, and an `/api/v1/*` JSON response. See the checks at the bottom.  │
# └─────────────────────────────────────────────────────────────────────────┘

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

# HSTS. Browsers ignore this over plain HTTP per RFC 6797, so its presence in
# the :80 server block is harmless rather than wrong. Note the consequence
# before enabling: `includeSubDomains` with a 1-year max-age applies to every
# tenant subdomain, and B2 recorded wildcard TLS as BLOCKED (the zone is on
# ns2.telecom.net.et, so DNS-01 is not available to us and each tenant host
# gets its own HTTP-01 certificate). A tenant host that is reachable before its
# certificate is issued becomes unreachable for a year rather than showing a
# warning the owner can click through.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# img-src is widened for tenant branding logos (PUT /settings/branding stores a
# URL rendered straight into <img src> across the sidebar, header, mobile nav
# and kiosk). connect-src carries no wss: — Reverb is not deployed here
# (BROADCAST_CONNECTION=log).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ═══════════════════════════════════════════════════════════════════════════
# 2. Deny rules
# ═══════════════════════════════════════════════════════════════════════════
#
# Defence in depth, and honest about being exactly that. In the deployment
# layout this directory describes, the Laravel application lives in `~/ethr`,
# entirely outside the document root — so `.env`, `.git/` and `vendor/` are not under
# the document root and are not reachable whether these rules apply or not. The
# layout is the control; these rules are the second line, for the day a file is
# uploaded to the wrong place, an archive is unpacked in the document root, or
# the document root is repointed.

# Dotfiles, with an explicit hole for ACME.
#
# `.well-known/acme-challenge/` is how every certificate on this account is
# issued and renewed — B2 proved HTTP-01 works here and is the only method
# available, since the DNS zone is not ours. A blanket dotfile deny is the
# classic way to make renewals start failing 60 days later, when nobody
# connects the two events. The negative lookahead is the whole point of this
# rule; do not simplify it to `location ~ /\.`.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

# Repository and toolchain files, if one ever lands in the document root.
location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|artisan|phpunit\.xml(\.dist)?|Dockerfile|docker-compose\.ya?ml)$ {
    deny all;
}

# Laravel's internal directories. Matches the `.htaccess` rule exactly,
# including its consequence: this also blocks the public symlink that
# `php artisan storage:link` creates. That is parity with the current Apache
# config rather than a new restriction — ETHR serves employee documents through
# signed `temporaryUrl()` routes handled by Laravel, never from `/storage`, so
# nothing legitimate goes through this path. If that ever changes, this rule and
# the `.htaccess` one have to change together.
location ~ ^/(storage|bootstrap/cache)(/|$) {
    deny all;
}

# ═══════════════════════════════════════════════════════════════════════════
# 3. Long-running request budget
# ═══════════════════════════════════════════════════════════════════════════
#
# The `.htaccess` set `max_execution_time 120` for the whole vhost, having
# already conceded that this layer cannot express a per-route budget. (That
# 120s figure came from the VPS nginx config historically; it is not a value
# this file is obliged to track.) Same concession here, for the same reason, and
# deliberately at server level rather than in a route-specific `location`:
# a `location` block that matches an API path but carries neither `proxy_pass`
# nor `fastcgi_pass` takes the request away from whatever was handling it and
# 404s. Server-level timeouts inherit into every location without that risk.
#
# These are the read timeouts only. They do not raise PHP's own
# `max_execution_time`, which is set in Plesk → PHP Settings and must be raised
# there to match, or the request dies at the PHP end with nginx still waiting.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
fastcgi_read_timeout 120s;
fastcgi_send_timeout 120s;

# Employee imports and document uploads. The `.htaccess` never set this because
# Apache's default is generous; nginx defaults to 1m and returns 413.
client_max_body_size 32m;

# ═══════════════════════════════════════════════════════════════════════════
