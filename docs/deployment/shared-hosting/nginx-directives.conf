# ═══════════════════════════════════════════════════════════════════════════
# 5. Verify the paste — these are the acceptance checks, not a suggestion
# ═══════════════════════════════════════════════════════════════════════════
#
# Run all five and record them in docs/deployment/GATE-0-RESULT.md. A paste that
# has not been verified on the live host is worth exactly as much as the
# .htaccess it replaced.
#
#   # Headers reach an HTML route
#   curl -sI https://<host>/ | grep -iE 'content-security-policy|x-frame-options'
#
#   # Headers reach a static asset — the add_header inheritance trap
#   curl -sI https://<host>/favicon.ico | grep -iE 'content-security-policy'
#
#   # Headers reach a JSON API response — same trap, different location block
#   curl -sI https://<host>/api/v1/health | grep -iE 'content-security-policy'
#
#   # Deny rules bite. 403 required. A 404 is NOT a pass — it means the file is
#   # absent, and the same request returns 200 the moment it is not.
#   curl -s -o /dev/null -w '%{http_code}\n' https://<host>/.env
#
#   # ACME still reachable, i.e. the dotfile rule did not eat certificate
#   # renewal. Anything except 403 is fine here; 403 means renewals will fail.
#   curl -s -o /dev/null -w '%{http_code}\n' https://<host>/.well-known/acme-challenge/probe
#
# If check 2 or 3 comes back empty while check 1 passes, you have hit the
# inheritance trap: find the Plesk-generated location that handles that path and
# repeat the section 1 headers inside it, the way section 4 does.
