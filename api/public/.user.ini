; ETHR — PHP limits for the document root. Shipped as httpdocs/.user.ini by
; scripts/shared-hosting/build-release.sh.
;
; WHY A FILE. On this account Plesk's PHP Settings page shows these values as
; read-only ("You can change the PHP configuration if the hosting provider
; grants you the corresponding permission" — panel reading 2026-10-06), and the
; same page says .user.ini overrides them. PHP-FPM reads .user.ini from the
; directory of the executed script; index.php is in the document root, so this
; file governs every request ETHR serves. Changes take effect within
; user_ini.cache_ttl (300 s by default).
;
; The floors are the hosting probe's (scripts/hosting-verification/
; ethr-hosting-check.php L1-L4). post_max_size sits above upload_max_filesize so
; a 10 MB document plus its form fields still fits.
;
; Not served: .htaccess denies .user.ini with [F,L].
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 12M
